# Configuracoes de Conexao com o banco de dados (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracoes do JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true


# JWT Secret (maps to api.security.token.secret) - OBRIGATORIO, minimo 32 bytes.
# A aplicacao NAO inicia sem ele. Em producao/staging gere um valor unico:
#   openssl rand -base64 32
# O valor abaixo serve apenas para desenvolvimento local.
API_SECURITY_TOKEN_SECRET=dev-local-ecociclo-troque-em-producao-32b
# Validade do token (opcional, padrao 2h)
API_SECURITY_TOKEN_EXPIRATION=2h