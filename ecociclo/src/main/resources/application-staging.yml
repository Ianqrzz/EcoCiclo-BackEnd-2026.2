server:
  port: ${SERVER_PORT:8080}
  error:
    # Evita mostrar detalhes internos nas respostas de erro.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://staging-db:5432/ecociclo_staging}
    username: ${DB_USER:ecociclo_staging}
    password: ${DB_PASSWORD:staging_local_only}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  sql:
    init:
      mode: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    org.springframework: WARN
    org.hibernate.SQL: WARN
  structured:
    format:
      console: logstash

api:
  security:
    token:
      secret: ${JWT_SECRET:local-staging-secret-change-before-sharing-0123456789}
