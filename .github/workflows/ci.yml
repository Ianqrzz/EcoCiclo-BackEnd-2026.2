name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build-e-testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecociclo

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      API_SECURITY_TOKEN_SECRET: segredo-apenas-para-o-ci-com-mais-de-32-bytes

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, testes e cobertura
        run: sh ./mvnw -B -ntp clean verify

      - name: Publicar relatório JaCoCo
        uses: actions/upload-artifact@v7
        with:
          name: jacoco
          path: ecociclo/target/site/jacoco

      - name: Análise SonarQube Cloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          sh ./mvnw -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:5.9.0.7382:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=ianqrzz
          -Dsonar.projectKey=Ianqrzz_EcoCiclo-BackEnd-2026.2